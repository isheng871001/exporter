
devices:
  - name: "mRack"
    rack_name: "F20"
    BMC_ip: ""
    metrics:
      liquid_cooling_valve_setting_celsius:
        sensors:
          - "VIN_S"
          - "VOU_S"
          - "VBR_S"
          - "VPH_S"
          - "P_FIN"
          - "P_FOU"
          - "PH"
          - "Cond"

      chassis_ambient_environment_celsius:
        sensors:
          - "Ta"
          - "DPT"
          - "RH"

      power_meter_watts:
        sensors:
          - "POW_F{1~4}"
          - "POW_R{1~4}"
          - "POW_P{1~3}"

      power_meter_volts:
        sensors:
          - "VOL_F{1~4}"
          - "VOL_R{1~4}"

      power_meter_amps:
        sensors:
          - "CUR_F{1~4}"
          - "CUR_R{1~4}"
          - "CUR_P{1~3}"

      power_meter_factors:
        sensors:
          - "PWF_F{1~4}"
          - "PWF_R{1~4}"

      pump_PWM_values:
        sensors:
          - "PWM_P{1~3}"

      pump_RPM_values:
        sensors:
          - "RPM_P{1~3}"

      power_status_HAC:
        sensors:
          - "Sensor_H{1~7}{A,B}{1~3}_R"

      mrack_tank_level:
        sensors:
          - "Sensor_LEVH"
          - "Sensor_LEVM"
          - "Sensor_LEVL"

      mrack_leakage_sensor:
        sensors:
          - "Sensor_SSP_L"
          - "Sensor_mR1_L"
          - "Sensor_mR1H{1~7}_L"
          - "Sensor_mR2_L"
          - "Sensor_mR2H{1~7}_L"
          - "Sensor_EB_L"

      mrack_BMC_status:
        sensors:
          - "BMC_CPU_Util"
          - "BMC_Mem_Util"
          - "Peer_BMC_Status"

  - name: "tCDU"
    rack_name: "F20"
    BMC_ip: ""
    metrics: 
      tCDU_sensors_temperatures:
        sensors:
          - "T_WI1"
          - "T_WI2"
          - "T_WO1"
          - "T_WO2"
          - "T_CS1"
          - "T_CS2"
          - "T_CR1"
          - "T_CR2"
          - "T_P1_Motor"
          - "T_P1_Bearing"
          - "T_P2_Motor"
          - "T_P2_Bearing"
          - "Ta"
          - "DPT"
          - "RH"
      tCDU_sensors_pressures:
        sensors:
          - "P_WI1"
          - "P_WI2"
          - "P_WO1"
          - "P_WO2"
          - "P_CS1"
          - "P_CS2"
          - "P_CR1"
          - "P_CR2"
          - "P_WIF1"
          - "P_WIF2"
          - "P_CRF1"
          - "P_CRF2"
          - "P_P1"
          - "P_P2"
          - "P_DIFF"
      tCDU_pump_metrics:
        sensors:
          - "PWM_P1"
          - "PWM_P2"
          - "POW_P1"
          - "POW_P2"
          - "RPM_P1"
          - "RPM_P2"
          - "CUR_P1"
          - "CUR_P2"
      tCDU_leakage_metrics:
        sensors:
          - "Sensor_LEV1"
          - "Sensor_LEV2"
          - "Sensor_LEV3"
          - "Sensor_L1"
          - "Sensor_L2"
          - "Sensor_L3"
          - "Sensor_L4"
      tCDU_sensor_metrics:
        sensors:
          - "LPM_W"
          - "LPM_C"
          - "VIN_S"
          - "POW_IN1"
          - "POW_IN2"
          - "VOL_IN1"
          - "VOL_IN2"
          - "CUR_IN1"
          - "CUR_IN2"
          - "POW_Total"
          - "Status_VFD1"
          - "Status_VFD2"
          - "Status_PSU1"
          - "Status_PSU2"
          - "BMC_CPU_Util"
          - "BMC_Mem_Util"
      

